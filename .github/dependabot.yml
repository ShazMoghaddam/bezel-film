version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Keep Node's types at the oldest Node we support (see "engines" in package.json),
      # so the code can't use features that only exist in newer Node versions.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must stay on the same major version as the one kokoro-js uses, so they share one copy.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
