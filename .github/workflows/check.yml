name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The voice engine would otherwise download large GPU files on Linux. Bezel Film runs the voice on the CPU.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  render:
    name: Render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the headless browser and its system libraries
        run: npx playwright-core install chromium --only-shell --with-deps
      - run: npm run smoke
