name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The voice engine would otherwise download large GPU files on Linux. Bezel Film runs the voice on the CPU.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

# A new push to a pull request replaces the run before it. On main, each commit gets its
# own group, so every merge gets its own full run and a merge never looks broken just
# because another landed straight after.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  render:
    name: Render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Microsoft's Playwright image already has the browser's system libraries, so the job
    # doesn't wait on Ubuntu's package servers, which are sometimes very slow.
    # Keep the version in step with playwright-core in package.json.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Usually already in the image. If playwright-core has moved on, this fetches the matching browser.
      - name: Install the headless browser
        run: npx playwright-core install chromium --only-shell
      - run: npm run smoke
