name: Release

# Publishes to npm when a GitHub release is published. No npm token or login is
# needed: npm trusts this workflow directly (trusted publishing, using OpenID Connect),
# and adds a provenance statement linking the package to this exact build.
#
# Because the release (and its tag) exists before this runs, films can always
# download the music from the tag the moment the new version appears on npm.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Lets the job ask GitHub for a short-lived identity token, which npm checks
  # against the trusted publisher set up in the package's npm settings.
  id-token: write

env:
  # The voice engine would otherwise download large GPU files on Linux. Bezel Film runs the voice on the CPU.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A release event checks out the release's tag.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 comes with npm 11, which trusted publishing needs (11.5.1 or later).
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in release builds: every file is fetched fresh.
          package-manager-cache: false

      - name: Check the tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME but package.json says $version. Bump the version and tag again."
            exit 1
          fi

      - name: Check the music is in the tag
        # Films download their music from this tag, so every track must be here.
        run: |
          node -e "
            const { tracks } = require('./music/manifest.json');
            const fs = require('node:fs');
            const missing = Object.values(tracks).map((t) => t.file).filter((f) => !fs.existsSync('music/' + f));
            if (missing.length) { console.error('::error::Missing from music/: ' + missing.join(', ')); process.exit(1); }
            console.log('All ' + Object.keys(tracks).length + ' tracks are in the tag.');
          "

      - run: npm ci
      # `npm publish` runs `prepublishOnly` (the full check) and `prepack` (the build) first.
      - run: npm publish
